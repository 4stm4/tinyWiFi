# TinyWifi main configuration.
# Paths point at the on-device (rootfs) locations; the repo copies under
# configs/ are the source of truth that gets installed into the image.

[web]
# HTTPS (self-signed cert generated on first boot into /etc/tinywifi/tls/).
# Standard ports; tinywifi-web runs as root and can bind 80/443.
listen = "0.0.0.0:443"
# Plain HTTP; redirects every request to https://.../
http_redirect_listen = "0.0.0.0:80"

[display]
refresh_secs = 10

[paths]
hostapd_conf = "/etc/hostapd/hostapd.conf"
nanodhcp_conf = "/etc/nanodhcp/nanodhcp.conf"
nanodns_conf = "/etc/nanodns/config"
leases_file = "/var/lib/nanodhcp/leases"

[services]
hostapd = "hostapd"
nanodhcp = "nanodhcp"
nanodns = "nanodns"
web = "tinywifi-web"
display = "tinywifi-display"
